<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Runner — Universal Sales Chat Engine</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      padding: 32px 20px;
      font-family: var(--font-sans);
    }
    .runner-wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    .header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #334155;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-badge {
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-pass {
      background-color: rgba(34, 197, 94, 0.15);
      border: 1px solid #22C55E;
      color: #4ADE80;
    }
    .stat-fail {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid #EF4444;
      color: #F87171;
    }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .test-item {
      background-color: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
    }
    .badge-pass {
      background-color: #10B981;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-fail {
      background-color: #EF4444;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .btn-run {
      background-color: #2563EB;
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="runner-wrap">
    <div class="header-box">
      <div>
        <h1 class="title">🧪 Test Runner Automatizado</h1>
        <p style="color:#94A3B8; font-size:13px; margin-top:4px;">Universal Sales Chat Engine — Validação do Núcleo e Serviços</p>
      </div>
      <div>
        <button type="button" class="btn-run" id="btn-re-run">Executar Novamente</button>
      </div>
    </div>

    <div class="stats-bar" id="stats-bar">
      <div class="stat-badge stat-pass" id="badge-pass-count">Passando: --</div>
      <div class="stat-badge stat-fail" id="badge-fail-count">Falhas: --</div>
    </div>

    <div class="test-list" id="test-results-container">
      <div style="color:#94A3B8; text-align:center; padding:20px;">Carregando testes...</div>
    </div>

    <div style="margin-top:32px; display:flex; gap:12px; justify-content:center;">
      <a href="../index.html" class="btn-run" style="background:#334155; text-decoration:none;">💬 Ir para o Chat de Vendas</a>
      <a href="../admin.html" class="btn-run" style="background:#334155; text-decoration:none;">⚙️ Ir para o Painel Admin</a>
    </div>
  </div>

  <script type="module">
    import { runAllTests } from './test-suite.js';

    async function execute() {
      const container = document.getElementById('test-results-container');
      const passEl = document.getElementById('badge-pass-count');
      const failEl = document.getElementById('badge-fail-count');

      container.innerHTML = '<div style="color:#94A3B8; text-align:center; padding:20px;">Executando testes...</div>';

      const summary = await runAllTests();

      passEl.textContent = `✓ Passando: ${summary.passed}`;
      failEl.textContent = `✕ Falhas: ${summary.failed}`;

      container.innerHTML = summary.results.map(r => `
        <div class="test-item" style="${r.status === 'FAIL' ? 'border-color:#EF4444;' : ''}">
          <span>${r.message}</span>
          <span class="${r.status === 'PASS' ? 'badge-pass' : 'badge-fail'}">${r.status}</span>
        </div>
      `).join('');
    }

    document.getElementById('btn-re-run').addEventListener('click', execute);
    execute();
  </script>
</body>
</html>
